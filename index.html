<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人首頁 | My Space</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <div class="logo">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="12" cy="12" r="10" stroke="url(#paint0_linear)" stroke-width="2"/>
                <path d="M9 8.5C9 8.5 12.1818 10 12.5 13C12.8182 16 9.5 17 9.5 17M15 12L12 9M15 12L18 15" stroke="url(#paint1_linear)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <defs>
                    <linearGradient id="paint0_linear" x1="12" y1="2" x2="12" y2="22" gradientUnits="userSpaceOnUse">
                        <stop stop-color="#805AD5"/>
                        <stop offset="1" stop-color="#4F46E5"/>
                    </linearGradient>
                    <linearGradient id="paint1_linear" x1="9.5" y1="8.5" x2="15.5" y2="15.5" gradientUnits="userSpaceOnUse">
                        <stop stop-color="#9F7AEA"/>
                        <stop offset="1" stop-color="#667EEA"/>
                    </linearGradient>
                </defs>
            </svg>
            <span class="logo-text">YOUR NAME</span> 
        </div>
    </nav>

    <main class="container">
        <h1 class="site-title" id="mainTitle">網站名字</h1>

        <div class="grid-layout">
            <a href="https://google.com" class="nav-card">
                <div class="icon">🚀</div>
                <span>進入入口</span>
            </a>
            <a href="#" class="nav-card">
                <div class="icon">🎨</div>
                <span>設計作品</span>
            </a>
            <a href="#" class="nav-card">
                <div class="icon">📷</div>
                <span>攝影紀錄</span>
            </a>
            <a href="#" class="nav-card">
                <div class="icon">✉️</div>
                <span>聯絡我</span>
            </a>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
