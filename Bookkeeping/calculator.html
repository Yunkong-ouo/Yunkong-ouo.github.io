<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>計算機</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="app">
      <header class="page-header">
        <a href="index.html" class="back-btn"> ← 返回主頁 </a>

        <div class="page-title">
          <h1>計算機</h1>

          <p>快速計算</p>
        </div>

        <div></div>
      </header>

      <main class="calculator-page">
        <div class="calculator">
          <div class="calculator-header">
            <div>
              <h1>計算機</h1>

              <span> 快速計算 </span>
            </div>
          </div>

          <!-- Display -->

          <div class="calculator-screen">
            <div id="calculatorExpression" class="calculator-expression"></div>

            <div id="calculatorDisplay" class="calculator-display">0</div>
          </div>

          <!-- 4 x 5 -->

          <div class="calculator-grid">
            <button class="calc-btn function" data-action="clear">AC</button>

            <button class="calc-btn function" data-action="parentheses">
              ()
            </button>

            <button class="calc-btn function" data-action="percent">%</button>

            <button class="calc-btn operator" data-value="/">÷</button>

            <button class="calc-btn" data-value="7">7</button>

            <button class="calc-btn" data-value="8">8</button>

            <button class="calc-btn" data-value="9">9</button>

            <button class="calc-btn operator" data-value="*">×</button>

            <button class="calc-btn" data-value="4">4</button>

            <button class="calc-btn" data-value="5">5</button>

            <button class="calc-btn" data-value="6">6</button>

            <button class="calc-btn operator" data-value="+">+</button>

            <button class="calc-btn" data-value="1">1</button>

            <button class="calc-btn" data-value="2">2</button>

            <button class="calc-btn" data-value="3">3</button>

            <button class="calc-btn operator" data-value="-">-</button>

            <button class="calc-btn" data-value="0">0</button>

            <button class="calc-btn" data-value=".">.</button>

            <button class="calc-btn equals" data-action="equals">=</button>

            <button class="calc-btn function" data-action="backspace">
              退後
            </button>
          </div>
        </div>
      </main>
    </div>

    <script src="calculator.js"></script>
  </body>
</html>
